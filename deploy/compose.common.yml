services:
  app:
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev,mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    expose: ["8080"]
    volumes:
      - data:/data
      - type: bind
        source: ./branding
        target: /app/branding
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "apps/server/dist/healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      start_interval: 1s
      retries: 3
