name: rawmat-dev

services:
  app:
    extends:
      file: compose.common.yml
      service: app
    image: rawmat:dev
    build:
      context: ..
    environment:
      APP_URL: http://127.0.0.1:${LOCAL_PORT:-8080}
      RAWMAT_LOCAL_DEV: "1"
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:8080"

volumes:
  data: {}
