name: ${COMPOSE_PROJECT_NAME:-rawmat}

services:
  app:
    extends:
      file: compose.common.yml
      service: app
    image: ${APP_IMAGE:?Set APP_IMAGE to the application image}
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      BASE_CURRENCY: ${BASE_CURRENCY:-TRY}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to 32 random bytes in hexadecimal}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MATERIAL_SIMILARITY_WARNING: ${MATERIAL_SIMILARITY_WARNING:-0.60}
      MATERIAL_SIMILARITY_HIGH: ${MATERIAL_SIMILARITY_HIGH:-0.85}
    networks:
      default: {}
      edge:
        aliases: ["${COMPOSE_PROJECT_NAME:-rawmat}-web"]

volumes:
  data: {}

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?Set EDGE_NETWORK to the reverse proxy network}
