name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --output "$tool_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          (
            cd "$tool_dir"
            echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
            tar -xzf gitleaks.tar.gz gitleaks
          )
          "$tool_dir/gitleaks" git --log-opts='--all' --redact --no-banner .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

      - name: Build and verify the container
        run: |
          SESSION_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")" \
            docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag rawmat:dev .
          docker compose -f deploy/compose.dev.yml up --no-build --wait --wait-timeout 70
          test "$(curl --fail --silent --show-error http://127.0.0.1:8080/healthz)" = '{"status":"ok"}'
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 302
          curl --fail --silent --show-error http://127.0.0.1:8080/login -o "$RUNNER_TEMP/rawmat-index.html"
          grep -F 'lang="ar" dir="rtl"' "$RUNNER_TEMP/rawmat-index.html"
          asset="$(sed -n 's/.*src="\(\/assets\/[^"]*\.js\)".*/\1/p' "$RUNNER_TEMP/rawmat-index.html")"
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:8080$asset" -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/branding/logo.png -o "$RUNNER_TEMP/rawmat-logo.png"
          grep -F 'href="/branding/theme.css"' "$RUNNER_TEMP/rawmat-index.html"
          curl --fail --silent --show-error http://127.0.0.1:8080/branding/theme.css -o /dev/null
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/manage/accounts)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/materials)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/purchases)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/shipments)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/notifications)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/overview/export)" = 404
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const matches = Object.entries(lock.packages).filter(([path]) => path.endsWith('/picomatch'))
          assert(matches.length > 0)
          for (const [, dependency] of matches) {
            assert.equal(dependency.version, '4.0.7')
            assert.equal(dependency.dev, true)
          }
          NODE
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            rawmat:dev -e "try { require.resolve('picomatch'); process.exitCode = 1 } catch (error) { if (error.code !== 'MODULE_NOT_FOUND') throw error }"

      - name: Restore a live SQLite snapshot in a separate volume
        shell: bash
        run: |
          compose=(docker compose -f deploy/compose.dev.yml)
          export LOCAL_PORT=18081
          recovery=(docker compose -p rawmat-restore-check -f deploy/compose.dev.yml)
          snapshot="$(LOCAL_PORT=8080 "${compose[@]}" exec -T app /nodejs/bin/node apps/server/dist/cli/database-backup.js create)"
          LOCAL_PORT=8080 "${compose[@]}" cp "app:$snapshot" "$RUNNER_TEMP/rawmat-snapshot.sqlite"
          "${recovery[@]}" run --rm --no-deps -T --entrypoint /nodejs/bin/node app \
            apps/server/dist/cli/database-backup.js restore < "$RUNNER_TEMP/rawmat-snapshot.sqlite"
          "${recovery[@]}" up -d --no-build --wait --wait-timeout 30
          test "$(curl --fail --silent --show-error http://127.0.0.1:18081/healthz)" = '{"status":"ok"}'

      - name: Scan locked dependencies and the image, and generate an SBOM
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --output "$tool_dir/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          (
            cd "$tool_dir"
            echo 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tar.gz' | sha256sum -c -
            tar -xzf trivy.tar.gz trivy
          )
          "$tool_dir/trivy" fs --vex deploy/security/build-dependencies.vex.json \
            --show-suppressed --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 package-lock.json
          "$tool_dir/trivy" image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 rawmat:dev
          "$tool_dir/trivy" image --format cyclonedx --output "$RUNNER_TEMP/rawmat-image.cdx.json" rawmat:dev
          "$tool_dir/trivy" fs --include-dev-deps --format cyclonedx --output "$RUNNER_TEMP/rawmat-npm.cdx.json" package-lock.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawmat-sbom
          path: |
            ${{ runner.temp }}/rawmat-image.cdx.json
            ${{ runner.temp }}/rawmat-npm.cdx.json
          if-no-files-found: error

      - name: Save the tested release image
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          docker image inspect --format '{{.Id}}' rawmat:dev > "$RUNNER_TEMP/rawmat-image-id.txt"
          docker save --output "$RUNNER_TEMP/rawmat-image.tar" rawmat:dev

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: rawmat-release-image
          path: |
            ${{ runner.temp }}/rawmat-image.tar
            ${{ runner.temp }}/rawmat-image-id.txt
          retention-days: 1
          if-no-files-found: error

      - name: Remove test containers
        if: always()
        run: |
          LOCAL_PORT=18081 docker compose -p rawmat-restore-check -f deploy/compose.dev.yml down --volumes
          docker compose -f deploy/compose.dev.yml down --volumes

  publish-image:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'mrchemist03/rawmat'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/mrchemist03/rawmat
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rawmat-release-image
          path: ${{ runner.temp }}/release-image

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rawmat-sbom
          path: ${{ runner.temp }}/release-sbom

      - name: Push the tested image by digest
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/release-image/rawmat-image.tar"
          config_path="$(tar -xOf "$archive" manifest.json | jq -er 'if length == 1 then .[0].Config else error("Expected one image") end')"
          [[ "$config_path" =~ ^(blobs/sha256/[a-f0-9]{64}|[a-f0-9]{64}\.json)$ ]]
          config_digest="sha256:$(tar -xOf "$archive" "$config_path" | sha256sum | cut -d ' ' -f 1)"
          docker load --input "$archive"
          image_id="$(cat "$RUNNER_TEMP/release-image/rawmat-image-id.txt")"
          test "$(docker image inspect --format '{{.Id}}' rawmat:dev)" = "$image_id"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' rawmat:dev)" = "$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          candidate_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          candidate="$IMAGE:$candidate_tag"
          docker image tag rawmat:dev "$candidate"
          docker push --platform linux/amd64 "$candidate" | tee "$RUNNER_TEMP/rawmat-image-push.log"
          digest="$(awk -v tag="$candidate_tag:" '$1 == tag && $2 == "digest:" { print $3 }' "$RUNNER_TEMP/rawmat-image-push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          registry_config="$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -r '.config.digest')"
          if [[ "$registry_config" != "$config_digest" ]]; then
            printf 'Registry image config %s differs from the tested archive config %s\n' "$registry_config" "$config_digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release-sbom/rawmat-image.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Sign the loadable archive and its SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-image/rawmat-image.tar
          sbom-path: ${{ runner.temp }}/release-sbom/rawmat-image.cdx.json

      - name: Verify both signatures and publish the version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          subject="oci://$IMAGE@$IMAGE_DIGEST"
          policy=(--repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          gh attestation verify "$subject" "${policy[@]}" --bundle-from-oci
          gh attestation verify "$subject" "${policy[@]}" --bundle-from-oci --predicate-type https://cyclonedx.org/bom
          gh attestation verify "$RUNNER_TEMP/release-image/rawmat-image.tar" "${policy[@]}" --predicate-type https://cyclonedx.org/bom
          version="$IMAGE:$GITHUB_REF_NAME"
          if existing="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$version" 2>&1)"; then
            test "$existing" = "$IMAGE_DIGEST"
          elif [[ "$existing" == "ERROR: $version: not found" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$version" "$IMAGE@$IMAGE_DIGEST"
          else
            printf '%s\n' "$existing" >&2
            exit 1
          fi
          test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$version")" = "$IMAGE_DIGEST"
          printf 'Verified image `%s@%s` for `%s`.\n' "$IMAGE" "$IMAGE_DIGEST" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  publish-release:
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rawmat-release-image
          path: ${{ runner.temp }}/release-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rawmat-sbom
          path: ${{ runner.temp }}/release-sbom
      - name: Publish the signed release and CycloneDX inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/release-image/rawmat-image.tar"
          gzip -n -c "$archive" > "$RUNNER_TEMP/rawmat-image-linux-amd64.tar.gz"
          notes="$RUNNER_TEMP/rawmat-release-notes.md"
          cat > "$notes" <<EOF
          صورة Rawmat الموقّعة لـ Linux ‏amd64.

          - بصمة الصورة ghcr.io/mrchemist03/rawmat@$IMAGE_DIGEST
          - بصمة الالتزام $GITHUB_SHA
          - [طريقة التحقق من التوقيع وتشغيل الصورة](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/deploy/release.md)
          - [فحوص الإصدار](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          يتوفر أرشيف الصورة وقائمة مكوّناتها أدناه.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Rawmat $GITHUB_REF_NAME" --notes-file "$notes" \
            "$RUNNER_TEMP/rawmat-image-linux-amd64.tar.gz" "$RUNNER_TEMP/release-sbom/rawmat-image.cdx.json"
